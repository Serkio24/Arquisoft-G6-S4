# Configuración del proyecto en SonarQube
# El scanner usa este archivo para saber qué analizar

sonar.projectKey=SprintArq4
sonar.projectName=Sprint4Arquisoft
sonar.projectVersion=1.0

# Carpetas a analizar (todos los microservicios)
sonar.sources=ms-quality-analysis/app,ms-report-service
sonar.tests=ms-quality-analysis/tests

# Exclusiones — no analizar dependencias ni migraciones
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/node_modules/**

# Lenguaje principal
sonar.language=py

# ── Quality Gate personalizado ────────────────────────────────────────────────
# El Quality Gate "ASR-Mantenibilidad" debe configurarse en la UI de SonarQube
# con la condición: sqale_rating (Maintainability Rating) <= A (1)
# Esto garantiza que el pipeline falle si la calificación baja de A.
